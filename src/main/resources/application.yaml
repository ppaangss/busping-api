spring:
  application:
    name: station-alarm

  profiles:
    active: dev  # 지정 없으면 dev (fake TAGO)

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/station_alarm?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate  # 스키마는 Flyway(db/migration)가 관리, 하이버네이트는 검증만
    show-sql: false
    open-in-view: false  # 영속성 컨텍스트를 요청 전체로 늘리지 않는다 - 트랜잭션 밖 커넥션 점유 차단

tago:
  api:
    type: ${TAGO_API_TYPE:json}
    default-num-of-rows: ${TAGO_DEFAULT_NUM_OF_ROWS:10}

  station:
    base-url: ${TAGO_STATION_BASE_URL:http://apis.data.go.kr/1613000/BusSttnInfoInqireService}

  arrival:
    base-url: ${TAGO_ARRIVAL_BASE_URL:http://apis.data.go.kr/1613000/ArvlInfoInqireService}

alarm:
  cooldown-seconds: 600 # 중복 발송 방지 쿨다운 TTL - 경계 플래핑 재호출에도 진입당 알람 1회

arrival-cache:
  ttl-seconds: 15 # 조회 자동 갱신 주기(30초)보다 짧게 - 재조회 시 자기 캐시는 반드시 만료, 적중은 남이 만든 더 새로운 데이터

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:serviceAccountKey.json}

server:
  port: 8080
  tomcat:
    mbeanregistry:
      enabled: true # 톰캣 스레드풀 메트릭(tomcat_threads_*) 노출에 필요

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus # 헬스체크(ALB) + 메트릭 수집(Prometheus)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true # Prometheus에서 p95 계산(histogram_quantile)에 필요한 버킷 노출
        http.client.requests: true # 외부 호출(TAGO) 지연 p95용
