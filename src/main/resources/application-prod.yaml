# 배포 환경 - 인프라 접속 정보와 TAGO 키 전부 환경변수 필수 (기본값 없음)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

tago:
  api:
    key: ${TAGO_API_KEY}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}
