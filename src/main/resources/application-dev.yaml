# 로컬 개발 - TAGO는 FakeTagoArrivalClient(가짜 도착 데이터)로 대체, 실 API 호출 없음
# 알람 플로우 테스트: 즐겨찾기 routeId를 FAKE-ROUTE로 등록하면 가짜 도착정보와 매칭된다
tago:
  api:
    key: fake-key-not-used  # fake 클라이언트라 실제로 쓰이지 않는다
  fake-latency-ms: 0

alarm:
  cooldown-seconds: 30  # dev에선 쿨다운 30초로 짧게 - 반복 테스트 편의 (운영 600초)

management:
  server:
    port: 8081  # actuator 분리 - 톰캣(8080)이 포화돼도 scrape가 줄 서지 않게 (02 실험에서 수집 공백 9초 관측)
