services:
  mysql:
    image: mysql:8
    container_name: station-mysql
    restart: always
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: station-redis
    ports:
      - "6379:6379"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: station-app
    ports:
      - "8080:8080"
      - "8081:8081"  # actuator 전용 (dev 프로파일 management.server.port)
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    environment:
      SPRING_PROFILES_ACTIVE: dev
#      ,benchmark
      DB_URL: jdbc:mysql://mysql:3306/station_alarm?serverTimezone=Asia/Seoul
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      FIREBASE_CREDENTIALS_PATH: /app/serviceAccountKey.json
      # FCM 장애 실험(02) 스위치 - 미지정 시 0(평시). 고정 지연은 MS 하나, 랜덤 범위는 MIN/MAX
      FCM_FAKE_LATENCY_MS: ${FCM_FAKE_LATENCY_MS:-0}
      FCM_FAKE_LATENCY_MIN_MS: ${FCM_FAKE_LATENCY_MIN_MS:-${FCM_FAKE_LATENCY_MS:-0}}
      FCM_FAKE_LATENCY_MAX_MS: ${FCM_FAKE_LATENCY_MAX_MS:-${FCM_FAKE_LATENCY_MS:-0}}
      

volumes:
  mysql-data: